<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box { fill:#ffffff; stroke:#333; stroke-width:1.5; rx:8; }
    .verified { stroke:#1a7f37; }
    .open { stroke:#9a6700; stroke-dasharray:6,3; }
    .title { font-size:15px; font-weight:600; fill:#111; }
    .sub { font-size:11.5px; fill:#444; }
    .tag { font-size:10.5px; font-weight:700; }
    .tag-verified { fill:#1a7f37; }
    .tag-open { fill:#9a6700; }
    .arrow { stroke:#333; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
    .lbl { font-size:11px; fill:#333; }
  </style>

  <rect x="0" y="0" width="1500" height="620" fill="#fbfbfb"/>
  <text x="20" y="28" font-size="18" font-weight="700" fill="#111">Simulink/mock GPS noise → ArduPilot EKF pipeline — verified live 2026-09-05</text>

  <!-- Row 1: physics -->
  <rect class="box verified" x="20" y="60" width="220" height="90"/>
  <text class="title" x="35" y="85">Gazebo (Harmonic)</text>
  <text class="sub" x="35" y="105">robotx_uav_course.sdf</text>
  <text class="sub" x="35" y="122">real physics, real buoys/gates</text>
  <text class="tag tag-verified" x="35" y="140">[OK] VERIFIED</text>

  <path class="arrow" d="M240,105 H300"/>
  <text class="lbl" x="270" y="98" font-size="9" text-anchor="middle">odometry</text>

  <!-- ros_gz bridge -->
  <rect class="box verified" x="300" y="60" width="220" height="90"/>
  <text class="title" x="315" y="85">ros_gz_bridge</text>
  <text class="sub" x="315" y="105">parameter_bridge, Harmonic-linked</text>
  <text class="sub" x="315" y="122">overlay build (apt pkg is Fortress-</text>
  <text class="sub" x="315" y="136">linked; silently drops all msgs)</text>
  <text class="tag tag-verified" x="315" y="150">[OK] FIXED + VERIFIED</text>

  <path class="arrow" d="M520,105 H580"/>

  <!-- Simulink / mock -->
  <rect class="box open" x="580" y="60" width="260" height="90"/>
  <text class="title" x="595" y="85">gps_sim_navtoolbox.slx</text>
  <text class="sub" x="595" y="105">4x gpsSensor + fix-quality state</text>
  <text class="sub" x="595" y="119">machine (see block diagram below)</text>
  <text class="tag tag-open" x="595" y="140">[--] NEEDS MATLAB TO RUN</text>

  <text class="sub" x="595" y="165" font-style="italic">stand-in used for live verification:</text>
  <rect class="box verified" x="580" y="172" width="260" height="86"/>
  <text class="title" x="595" y="195">mock_fix_publisher.py</text>
  <text class="sub" x="595" y="213">same /fix interface + buoy-proximity</text>
  <text class="sub" x="595" y="227">GPS degradation (spatial, not just time)</text>
  <text class="tag tag-verified" x="595" y="248">[OK] VERIFIED LIVE</text>

  <path class="arrow" d="M840,215 H900"/>
  <text class="lbl" x="870" y="208" font-size="9" text-anchor="middle">/fix</text>

  <!-- fix_to_gps_input -->
  <rect class="box verified" x="900" y="172" width="240" height="86"/>
  <text class="title" x="915" y="195">fix_to_gps_input.py</text>
  <text class="sub" x="915" y="213">relays /fix → MAVLink GPS_INPUT</text>
  <text class="sub" x="915" y="227">+ --diag-offset-test self-check mode</text>
  <text class="tag tag-verified" x="915" y="248">[OK] VERIFIED LIVE</text>

  <path class="arrow" d="M1140,215 H1200"/>
  <text class="lbl" x="1168" y="208" font-size="8" text-anchor="middle">GPS_INPUT</text>

  <!-- SITL EKF -->
  <rect class="box verified" x="1200" y="172" width="260" height="86"/>
  <text class="title" x="1215" y="195">ArduPilot SITL — EKF3</text>
  <text class="sub" x="1215" y="213">GPS1_TYPE=14 (MAV backend)</text>
  <text class="sub" x="1215" y="227">fuses injected fix into position est.</text>
  <text class="tag tag-verified" x="1215" y="248">[OK] VERIFIED LIVE</text>

  <path class="arrow" d="M1330,258 V300 H700 V330"/>
  <text class="lbl" x="900" y="295">GLOBAL_POSITION_INT tracks real flight</text>

  <!-- flight result -->
  <rect class="box verified" x="440" y="330" width="620" height="130"/>
  <text class="title" x="460" y="358">Live flight result — Course 1, 2026-09-05</text>
  <text class="sub" x="460" y="382">Armed → took off → flew all 4 waypoints (gates 1–3 + light buoy) → landed.</text>
  <text class="sub" x="460" y="400">GLOBAL_POSITION_INT tracked ~50m of real flight distance via injected</text>
  <text class="sub" x="460" y="418">noisy GPS_INPUT (0.4% error vs. real distance flown).</text>
  <text class="sub" x="460" y="436">Fix quality cycled DGPS (h_acc=0.40m) ↔ RTK-float (h_acc=0.02m) live,</text>
  <text class="sub" x="460" y="452">and degrades further within 8m of any real buoy/gate (see plot).</text>

  <!-- legend -->
  <rect x="20" y="560" width="14" height="14" fill="#fff" stroke="#1a7f37" stroke-width="1.5"/>
  <text class="sub" x="40" y="572">Verified with a live Gazebo+SITL+flight run</text>
  <rect x="380" y="560" width="14" height="14" fill="#fff" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text class="sub" x="400" y="572">Not runnable in this investigation (needs MATLAB) — logic unchanged</text>
</svg>
